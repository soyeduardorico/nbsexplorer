services:
  - type: web
    name: nbsexplorer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: EE_PROJECT
        value: exeter-gee-research
      - key: EE_SERVICE_ACCOUNT
        sync: false
      - key: EE_SERVICE_ACCOUNT_KEY
        sync: false
